name: Consumer docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize main builds and deployments without interrupting an active deploy.
concurrency:
  group: consumer-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate consumer docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.19'
          python-version: '3.12'
          enable-cache: false

      - name: Build and validate the site
        id: site
        shell: bash
        run: |
          site_dir=$(./bin/docs-build)
          printf 'path=%s\n' "$site_dir" >> "$GITHUB_OUTPUT"

      - name: Upload the validated Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ steps.site.outputs.path }}

  deploy:
    name: Deploy consumer docs to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
