deptrac:
    cache_file: var/cache/deptrac.cache
    paths:
        - ./src
    layers:
        - name: Domain
          collectors:
              - type: classLike
                value: ^Fight\\AccessControl\\Domain\\.*
        - name: Application
          collectors:
              - type: classLike
                value: ^Fight\\AccessControl\\Application\\.*
        - name: Adapter
          collectors:
              - type: classLike
                value: ^Fight\\AccessControl\\Adapter\\.*
        - name: PsrHttp
          collectors:
              - type: classLike
                value: ^Psr\\Http\\.*
        - name: LaravelHttp
          collectors:
              - type: classLike
                value: ^Illuminate\\(Http|Routing)\\.*
        - name: SymfonyHttp
          collectors:
              - type: classLike
                value: ^Symfony\\Component\\(EventDispatcher|HttpFoundation|HttpKernel|Routing)\\.*
        - name: CodeIgniterHttp
          collectors:
              - type: classLike
                value: ^CodeIgniter\\(CodeIgniter|Filters\\FilterInterface|HTTP\\.*|Router\\.*)$
              - type: classLike
                value: ^Config\\(App|Cache)$
        - name: CommonHttpError
          collectors:
              - type: classLike
                value: ^Fight\\Common\\Adapter\\Http\\Error\\.*
        - name: CommonTaskRouting
          collectors:
              - type: classLike
                value: ^Fight\\Common\\Adapter\\Messaging\\(Command\\Sync\\(Routing\\InMemoryCommandRouter|RoutingCommandBus)|Query\\(Routing\\InMemoryQueryRouter|RoutingQueryBus))$
        - name: CommonDomain
          collectors:
              - type: classLike
                value: ^Fight\\Common\\Domain\\.*
        - name: CommonApplication
          collectors:
              - type: classLike
                value: ^Fight\\Common\\Application\\.*
        - name: PhpInternal
          collectors:
              - type: php_internal
                value: .*
    ruleset:
        Domain:
            - Domain
            - CommonDomain
            - PhpInternal
        Application:
            - Application
            - Domain
            - CommonDomain
            - CommonApplication
            - PhpInternal
        Adapter:
            - Adapter
            - Application
            - Domain
            - CommonDomain
            - CommonApplication
            - PsrHttp
            - LaravelHttp
            - SymfonyHttp
            - CodeIgniterHttp
            - CommonHttpError
            - CommonTaskRouting
            - PhpInternal
        PsrHttp: []
        LaravelHttp: []
        SymfonyHttp: []
        CodeIgniterHttp: []
        CommonHttpError:
            - CommonApplication
            - PhpInternal
        CommonTaskRouting:
            - CommonApplication
            - CommonDomain
            - PhpInternal
        CommonDomain:
            - PhpInternal
        CommonApplication:
            - CommonDomain
            - PhpInternal
        PhpInternal: []
    skip_violations: {}
