deptrac:
    cache_file: var/cache/deptrac.cache
    paths:
        - ./src
    layers:
        - name: Domain
          collectors:
              - type: classLike
                value: ^Fight\\AccessControl\\Domain\\.*
        - name: Application
          collectors:
              - type: classLike
                value: ^Fight\\AccessControl\\Application\\.*
        - name: Adapter
          collectors:
              - type: classLike
                value: ^Fight\\AccessControl\\Adapter\\.*
        - name: PsrHttp
          collectors:
              - type: classLike
                value: ^Psr\\Http\\.*
        - name: CommonDomain
          collectors:
              - type: classLike
                value: ^Fight\\Common\\Domain\\.*
        - name: CommonApplication
          collectors:
              - type: classLike
                value: ^Fight\\Common\\Application\\.*
        - name: PhpInternal
          collectors:
              - type: php_internal
                value: .*
    ruleset:
        Domain:
            - Domain
            - CommonDomain
            - PhpInternal
        Application:
            - Application
            - Domain
            - CommonDomain
            - CommonApplication
            - PhpInternal
        Adapter:
            - Adapter
            - Application
            - Domain
            - CommonDomain
            - CommonApplication
            - PsrHttp
            - PhpInternal
        PsrHttp: []
        CommonDomain:
            - PhpInternal
        CommonApplication:
            - CommonDomain
            - PhpInternal
        PhpInternal: []
    skip_violations: {}
